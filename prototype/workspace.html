<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study · Совместная работа</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;color:#29445e;background:#eef4fa}header{height:56px;background:white;border-bottom:1px solid #d9e6f1;display:flex;align-items:center;gap:12px;padding:7px 14px}a{color:#286fae;text-decoration:none}header b{font-size:19px}.active{background:#286fae;color:white;padding:8px 11px;border-radius:9px}main{height:calc(100vh - 56px);display:flex;gap:4px;padding:5px}.pane{min-width:250px;flex:1;display:flex;flex-direction:column;background:white;border-radius:10px;overflow:hidden}.pane h2{font-size:12px;background:#e9f2fa;margin:0;padding:8px 12px}.pane iframe{border:0;flex:1;width:100%}.handle{width:10px;cursor:col-resize;background:#d2e2ef;border-radius:7px}.handle:hover{background:#7db4df}button{border:0;border-radius:8px;padding:8px 10px;background:#e7f0f9;color:#28618f;cursor:pointer}@media(max-width:850px){main{flex-direction:column}.handle{width:100%;height:9px;cursor:row-resize}}
.transfer-shield{position:fixed;inset:0;z-index:9999;cursor:grabbing;background:transparent;touch-action:none}.transfer-shield.over-lab{background:rgba(75,150,220,.06)}.transfer-shield.over-canvas{background:rgba(80,180,145,.06)}.drag-hint{position:fixed;z-index:10000;pointer-events:none;background:#fff;border:1px solid #a7cbe8;border-radius:10px;padding:9px 13px;box-shadow:0 8px 25px #24466533;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head><body><header><b>Study</b><a href="/">Начало</a><a href="/canvas">Доска</a><a href="/phonovision-3d">3D Lab</a><a class="active" href="/canvas" id="togglePanels" title="Повторное нажатие закрывает режим двух панелей">▣ Две панели ×</a><button id="swap">⇄ Поменять</button><span id="transferStatus" role="status">Перетаскивай карточки и изображения между панелями</span><span>Перетаскивай изображения и карточки между панелями</span></header><main id="main"><section class="pane" id="left"><h2>Свободная доска</h2><iframe src="/canvas" title="Свободная доска"></iframe></section><div class="handle" id="handle" role="separator" aria-label="Размер панелей" tabindex="0"></div><section class="pane" id="right"><h2>3D Lab</h2><iframe src="/phonovision-3d" title="3D Lab"></iframe></section></main><script>
const left=document.getElementById("left"),right=document.getElementById("right"),main=document.getElementById("main"),handle=document.getElementById("handle");let ratio=.52,drag=false;
function layout(){const horizontal=window.innerWidth>850;left.style.flex="0 0 "+ratio*100+"%";right.style.flex="1";handle.style.flex="0 0 10px";if(!horizontal)handle.style.height="10px"}
handle.onpointerdown=e=>{drag=true;handle.setPointerCapture(e.pointerId)};handle.onpointermove=e=>{if(!drag)return;const r=main.getBoundingClientRect();ratio=Math.max(.2,Math.min(.8,window.innerWidth>850?(e.clientX-r.left)/r.width:(e.clientY-r.top)/r.height));layout()};handle.onpointerup=()=>drag=false;
handle.onkeydown=e=>{if(["ArrowLeft","ArrowUp","ArrowRight","ArrowDown"].includes(e.key)){ratio=Math.max(.2,Math.min(.8,ratio+(e.key==="ArrowRight"||e.key==="ArrowDown"?.05:-.05)));layout()}};
let transfer=null,shield=null,hint=null;
function frameAt(x,y){for(const p of [left,right]){const frame=p.querySelector("iframe"),r=frame.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return {frame,rect:r,kind:new URL(frame.src).pathname==="/canvas"?"canvas":"lab"}}return null}
function clearTransfer(){shield?.remove();hint?.remove();shield=null;hint=null;transfer=null}
function moveTransfer(e){if(!transfer)return;transfer.x=e.clientX;transfer.y=e.clientY;hint.style.left=(e.clientX+16)+"px";hint.style.top=(e.clientY+16)+"px";const dest=frameAt(e.clientX,e.clientY);shield.className="transfer-shield"+(dest?" over-"+dest.kind:"")}
function finishTransfer(e){if(!transfer)return;const dest=frameAt(e.clientX,e.clientY),src=transfer.source;
 if(dest){const msg={kind:"study-transfer-deliver",payload:transfer.payload,clientX:e.clientX-dest.rect.left,clientY:e.clientY-dest.rect.top,from:src};
 dest.frame.contentWindow.postMessage(msg,location.origin);
 document.getElementById("transferStatus").textContent=dest.kind===src?"Элемент перемещён внутри панели":"Элемент перенесён в "+(dest.kind==="canvas"?"доску":"3D Lab");
 }else document.getElementById("transferStatus").textContent="Перенос отменён";
 clearTransfer()}
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||![left,right].some(p=>p.querySelector("iframe").contentWindow===event.source))return;
 const d=event.data;
 if(!d||d.kind!=="study-transfer-start"||transfer||!["canvas","lab"].includes(d.source))return;
 if(!d.payload||!["node","image"].includes(d.payload.kind))return;
 transfer={payload:d.payload,source:d.source,x:0,y:0};
 shield=document.createElement("div");shield.className="transfer-shield";document.body.append(shield);
 hint=document.createElement("div");hint.className="drag-hint";hint.textContent=(d.payload.text||"Изображение").slice(0,100);document.body.append(hint);
 const originFrame=[left,right].map(p=>p.querySelector("iframe")).find(frame=>frame.contentWindow===event.source);
 const r=originFrame.getBoundingClientRect();const x=r.left+(Number(d.clientX)||0),y=r.top+(Number(d.clientY)||0);
 moveTransfer({clientX:x,clientY:y});
 shield.addEventListener("pointermove",moveTransfer);
 shield.addEventListener("pointerup",finishTransfer);
 shield.addEventListener("pointercancel",clearTransfer);
 shield.addEventListener("pointerdown",e=>{e.preventDefault()});
 document.addEventListener("keydown",function cancel(e){if(e.key==="Escape"){clearTransfer();document.removeEventListener("keydown",cancel)}},{once:false});
},false);
document.getElementById("swap").onclick=()=>{const a=left.querySelector("iframe"),b=right.querySelector("iframe"),u=a.src;a.src=b.src;b.src=u};layout();
</script></body></html>
