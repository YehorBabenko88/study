<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study · Совместная работа</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;color:#29445e;background:#eef4fa}header{height:56px;background:white;border-bottom:1px solid #d9e6f1;display:flex;align-items:center;gap:12px;padding:7px 14px}a{color:#286fae;text-decoration:none}header b{font-size:19px}.active{background:#286fae;color:white;padding:8px 11px;border-radius:9px}main{height:calc(100vh - 56px);display:flex;gap:4px;padding:5px}.pane{min-width:250px;flex:1;display:flex;flex-direction:column;background:white;border-radius:10px;overflow:hidden}.pane h2{font-size:12px;background:#e9f2fa;margin:0;padding:8px 12px}.pane iframe{border:0;flex:1;width:100%}.handle{width:10px;cursor:col-resize;background:#d2e2ef;border-radius:7px}.handle:hover{background:#7db4df}button{border:0;border-radius:8px;padding:8px 10px;background:#e7f0f9;color:#28618f;cursor:pointer}@media(max-width:850px){main{flex-direction:column}.handle{width:100%;height:9px;cursor:row-resize}}
.transfer-shield{position:fixed;inset:0;z-index:9999;cursor:grabbing;background:transparent;touch-action:none}.transfer-shield.over-lab{background:rgba(75,150,220,.06)}.transfer-shield.over-canvas{background:rgba(80,180,145,.06)}.drag-hint{position:fixed;z-index:10000;pointer-events:none;width:190px;min-height:92px;transform:rotate(-2deg) scale(1.04);background:linear-gradient(145deg,#fff,#e9f4ff);border:2px solid #79b9ec;border-top:6px solid #4a9bdf;border-radius:15px;padding:13px;box-shadow:0 18px 40px #153f6880;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;white-space:normal;word-break:break-word}.drag-hint img{max-width:100%;max-height:110px;object-fit:contain;border-radius:8px}.drag-hint .ghost-label{position:absolute;bottom:3px;right:8px;font-size:10px;color:#6b8295}.transfer-shield.over-lab,.transfer-shield.over-canvas{outline:4px solid #6bb5f0;outline-offset:-5px}</style></head><body><header><b>Study</b><a href="/">Начало</a><a href="/canvas">Доска</a><a href="/phonovision-3d">3D Lab</a><a class="active" href="/canvas" id="togglePanels" title="Повторное нажатие закрывает режим двух панелей">▣ Две панели ×</a><button id="swap">⇄ Поменять</button><span id="transferStatus" role="status">Перетаскивай карточки и изображения между панелями</span><span>Перетаскивай изображения и карточки между панелями</span></header><main id="main"><section class="pane" id="left"><h2>Свободная доска</h2><iframe src="/canvas" title="Свободная доска"></iframe></section><div class="handle" id="handle" role="separator" aria-label="Размер панелей" tabindex="0"></div><section class="pane" id="right"><h2>3D Lab</h2><iframe src="/phonovision-3d" title="3D Lab"></iframe></section></main><script>
const left=document.getElementById("left"),right=document.getElementById("right"),main=document.getElementById("main"),handle=document.getElementById("handle");let ratio=.52,drag=false;
function layout(){const horizontal=window.innerWidth>850;left.style.flex="0 0 "+ratio*100+"%";right.style.flex="1";handle.style.flex="0 0 10px";if(!horizontal)handle.style.height="10px"}
handle.onpointerdown=e=>{drag=true;handle.setPointerCapture(e.pointerId)};handle.onpointermove=e=>{if(!drag)return;const r=main.getBoundingClientRect();ratio=Math.max(.2,Math.min(.8,window.innerWidth>850?(e.clientX-r.left)/r.width:(e.clientY-r.top)/r.height));layout()};handle.onpointerup=()=>drag=false;
handle.onkeydown=e=>{if(["ArrowLeft","ArrowUp","ArrowRight","ArrowDown"].includes(e.key)){ratio=Math.max(.2,Math.min(.8,ratio+(e.key==="ArrowRight"||e.key==="ArrowDown"?.05:-.05)));layout()}};
let transfer=null,shield=null,hint=null;
function frameAt(x,y){for(const p of [left,right]){const frame=p.querySelector("iframe"),r=frame.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return {frame,rect:r,kind:new URL(frame.src).pathname==="/canvas"?"canvas":"lab"}}return null}
let cancelKey=null;
function clearTransfer(){document.removeEventListener("pointermove",moveTransfer);document.removeEventListener("pointerup",finishTransfer);shield?.remove();hint?.remove();shield=null;hint=null;transfer=null;if(cancelKey){document.removeEventListener("keydown",cancelKey);cancelKey=null}document.body.style.userSelect=""}
function moveTransfer(e){if(!transfer)return;transfer.x=e.clientX;transfer.y=e.clientY;hint.style.left=Math.min(window.innerWidth-210,e.clientX+18)+"px";hint.style.top=Math.min(window.innerHeight-130,e.clientY+18)+"px";const dest=frameAt(e.clientX,e.clientY);shield.className="transfer-shield"+(dest?" over-"+dest.kind:"")}
function finishTransfer(e){if(!transfer)return;const dest=frameAt(e.clientX,e.clientY),src=transfer.source;
 if(dest){const msg={kind:"study-transfer-deliver",payload:transfer.payload,clientX:e.clientX-dest.rect.left,clientY:e.clientY-dest.rect.top,from:src};
 dest.frame.contentWindow.postMessage(msg,location.origin);
 document.getElementById("transferStatus").textContent=dest.kind===src?"Элемент перемещён внутри панели":"Элемент перенесён в "+(dest.kind==="canvas"?"доску":"3D Lab");
 }else document.getElementById("transferStatus").textContent="Перенос отменён";
 clearTransfer()}
// Same-origin direct bridge: synchronous activation during pointerdown avoids
// racing a queued postMessage against pointer capture in the source iframe.
window.studyTransferBridge={
 start(sourceWindow,source,payload,x,y){
  if(transfer||!["canvas","lab"].includes(source)||!payload||!["node","image"].includes(payload.kind))return false;
  const frame=[left,right].map(p=>p.querySelector("iframe")).find(f=>f.contentWindow===sourceWindow);
  if(!frame)return false;
  const r=frame.getBoundingClientRect();
  startTransfer(sourceWindow,source,payload,r.left+x,r.top+y);
  return true;
 },
 move(sourceWindow,x,y){
  if(!transfer)return;
  const frame=[left,right].map(p=>p.querySelector("iframe")).find(f=>f.contentWindow===sourceWindow);
  if(!frame)return;
  const r=frame.getBoundingClientRect();
  moveTransfer({clientX:r.left+x,clientY:r.top+y});
 },
 end(sourceWindow,x,y){
  if(!transfer)return;
  const frame=[left,right].map(p=>p.querySelector("iframe")).find(f=>f.contentWindow===sourceWindow);
  if(!frame)return;
  const r=frame.getBoundingClientRect();
  finishTransfer({clientX:r.left+x,clientY:r.top+y});
 },
 cancel(){clearTransfer()}
};
function startTransfer(sourceWindow,source,payload,x,y){
 transfer={payload,source,x,y};
 shield=document.createElement("div");shield.className="transfer-shield";document.body.append(shield);
 hint=document.createElement("div");hint.className="drag-hint";
 const label=document.createElement("span");label.textContent=(payload.text||"Изображение").slice(0,90);hint.append(label);
 const tag=document.createElement("span");tag.className="ghost-label";tag.textContent=payload.kind==="image"?"Изображение":"Карточка";hint.append(tag);
 if(payload.kind==="image"&&typeof payload.data_url==="string"&&payload.data_url.startsWith("data:image/png;base64,")){const img=document.createElement("img");img.src=payload.data_url;hint.replaceChildren(img,tag)}
 document.body.append(hint);document.body.style.userSelect="none";
 moveTransfer({clientX:x,clientY:y});
 shield.addEventListener("pointermove",moveTransfer);
 shield.addEventListener("pointerup",finishTransfer);
 shield.addEventListener("pointercancel",clearTransfer);
 document.addEventListener("pointermove",moveTransfer);
 document.addEventListener("pointerup",finishTransfer);
 cancelKey=e=>{if(e.key==="Escape")clearTransfer()};document.addEventListener("keydown",cancelKey);
}
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||![left,right].some(p=>p.querySelector("iframe").contentWindow===event.source))return;
 const d=event.data;
 if(!d||d.kind!=="study-transfer-start"||transfer||!["canvas","lab"].includes(d.source))return;
 if(!d.payload||!["node","image"].includes(d.payload.kind))return;
 const frame=[left,right].map(p=>p.querySelector("iframe")).find(f=>f.contentWindow===event.source);
 const rect=frame.getBoundingClientRect();
 startTransfer(event.source,d.source,d.payload,rect.left+(Number(d.clientX)||0),rect.top+(Number(d.clientY)||0));
},false);
document.getElementById("swap").onclick=()=>{const a=left.querySelector("iframe"),b=right.querySelector("iframe"),u=a.src;a.src=b.src;b.src=u};layout();
</script></body></html>
